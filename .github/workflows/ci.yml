name: CI

# Every PR and every push to main runs the one gate veri asks of the repos it works
# on — `make test` — dogfooding: a red baseline here would be exactly what the
# conductor refuses to start against (see Makefile's `test` target comment).
#
# A draft PR runs nothing. veri opens its PR as a draft when the plan is committed (#195)
# and pushes after every phase of every step, so `pull_request` on its default types ran
# this job 20-40 times per issue (#238: 42, #102: 36) — ~85% of the ~1,880 minutes billed
# 2026-09-15..27, and what exhausted the account's Actions allowance twice. None of those
# runs gated anything: each step's green leaf and both blind verifiers already run
# `make test` locally, and the merge skill reads CI only on the head it merges. So the job
# is skipped while the PR is a draft, and `ready_for_review` is added to the default
# types so the moment a run marks its PR ready — or the merge skill readies it — is the
# run that counts. Pushes to a PR that is already ready (a rebase before merge) still run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same PR cancels that PR's run still in progress. A ready PR takes
# several pushes within minutes — the run's metrics commit, criterion ticks, a repair
# step, the rebase before merge — and only the run on the head that gets merged gates
# anything (the merge skill reads CI on that head alone). At ~5 min a run after PRD 008,
# with two machines landing 20-30 PRs a day, superseded runs were a large share of the
# ~3,900 Linux minutes billed 2026-10-01..09, which exhausted the allowance a third time.
# Pushes to main are never cancelled: each merge keeps its own green check on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}

# The job's GITHUB_TOKEN can only read (PRD 022.10). Unstated, its scopes would be whatever the
# repository's default is, a setting that can change without a change here. actions/checkout needs
# `contents: read`, and nothing else the job does uses the token: the Actions cache (setup-python's
# pip cache, the bytecode cache's restore and save) authenticates with the runner's own cache token,
# not GITHUB_TOKEN's scopes. test_workflow_permissions.py refuses a workflow without this block or
# with any `write`.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    # A job that declares no timeout-minutes inherits GitHub's default ceiling of 6
    # hours, and while it burns those minutes it looks exactly like a slow run. This
    # job cannot legitimately be slow: `make test` is pytest over local files, with the
    # model stubbed via CLAUDE_BIN and no network call anywhere. So a gates job still
    # running past this cap is stuck, not slow, and the cap turns a six-hour silent bill
    # into a red tick that says so.
    #
    # It is **10 minutes**, a measurement: the last 12 green runs took 245-381 s from
    # creation to completion on 2026-11-11, and one took 538 s against the cap then in
    # force. It costs nothing on a green run (the repo is public, so runner minutes are
    # free); the price is that a STUCK job is noticed later. How the cap got here is
    # #3653's history, and `git log` holds every earlier value.
    timeout-minutes: 10

    env:
      VERI_PYCACHE: /home/runner/veri-pycache

    # Every action is pinned by its full commit sha, the tag it was beside it (PRD 022.20): a tag
    # can be moved to another commit, so what CI runs could change with no change here; a sha cannot.
    # Bumping one means looking the tag's commit up (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`,
    # dereferencing an annotated tag) and updating both. test_workflow_action_pins.py refuses a
    # `uses:` that is not a 40-hex sha followed by its tag.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Linux only. veri needs bash 5 (the Makefile refuses an older one); this runner
      # covers Linux, and development on a Mac, under Homebrew's bash 5, covers macOS.
      # A macos-latest runner used to sit beside this one; it re-checked the environment
      # the code was just tested on, at ten times the per-minute price of Linux, and was
      # ~94% of the billed minutes on 2026-09-11. bash is preinstalled, and nothing shells
      # out to jq or gh — the test suites stub the model via CLAUDE_BIN.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: make install-dev
        run: make install-dev

      # The bytecode cache (PRD 023.2). What is cached: VERI_PYCACHE, the pycache prefix `make test`
      # runs under — every veri module compiled and every test module pytest rewrote, plus the leg's
      # manifest of the sha256 each .pyc was compiled from. Without it every run compiles all of them.
      # Why mtimes are set from content: Python and pytest accept a cached .pyc only when its header's
      # source mtime and size match the file's, and a fresh checkout gives every file a new mtime, so a
      # restored cache would be voided whole. content_mtimes.py sets each tracked file's mtime from its
      # blob id: unchanged content gets the mtime it had when the cache was saved, changed content a
      # different one. The manifest stays the guard against a stale .pyc either way.
      # Only a push to main saves (after a green make test): a PR's cache is readable only by that PR,
      # and each save spends the repo's 10 GB cache allowance. A PR run restores the newest main cache
      # and never saves. Cost: no runner minutes beyond the restore and the save themselves (the repo
      # is public); a miss restores nothing and the run compiles from source as before.
      - name: stamp mtimes from content
        run: python3 skills/tdd/scripts/veri/content_mtimes.py

      - name: restore the bytecode cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/veri-pycache
          key: veri-pycache-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ github.sha }}
          restore-keys: veri-pycache-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      # pytest prints its slowest cases, so a slow run says which cases made it slow: the
      # job's time is decided by a few long cases at the end of the run, and the log
      # otherwise names none of them. Printing only; nothing reads it.
      # VERI_PYTEST_KEEP_RUN_DIR=1 leaves the leg's veri-pytest-* run directory in place (#4855):
      # removing its thousands of case directories after the last case was 8-13 s of the job's
      # wall time, and the runner is discarded after the job anyway. A leg nested inside a case
      # still cleans up, since hermetic_environment clears ambient VERI_*.
      - name: make test
        env:
          PYTEST_ADDOPTS: --durations=80 --durations-min=2
          VERI_PYTEST_KEEP_RUN_DIR: "1"
        run: make test

      - name: save the bytecode cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/veri-pycache
          key: veri-pycache-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ github.sha }}
