name: CI

# Every PR and every push to main runs the one gate veri asks of the repos it works
# on — `make test` — dogfooding: a red baseline here would be exactly what the
# conductor refuses to start against (see Makefile's `test` target comment).
#
# The docs gates (`make docs-check`, docs/tests/build-guards.test.sh) are deliberately
# NOT here. They were, from #34 until the day the walkthrough grew thirty sandboxed
# page builds: a job went from ~50 s to ~230 s on each runner, on every push of every
# PR, with macOS minutes billed at ten times Linux. Documentation drifting behind code
# must never block a TDD run (CLAUDE.md), so the docs gates are a local step of a docs
# PR — run `make docs-check` before merging one — not a tax on every commit.
#
# A draft PR runs nothing. veri opens its PR as a draft when the plan is committed (#195)
# and pushes after every phase of every step, so `pull_request` on its default types ran
# this job 20-40 times per issue (#238: 42, #102: 36) — ~85% of the ~1,880 minutes billed
# 2026-09-15..27, and what exhausted the account's Actions allowance twice. None of those
# runs gated anything: each step's green leaf and both blind verifiers already run
# `make test` locally, and the merge skill reads CI only on the head it merges. So the job
# is skipped while the PR is a draft, and `ready_for_review` is added to the default
# types so the moment a run marks its PR ready — or the merge skill readies it — is the
# run that counts. Pushes to a PR that is already ready (a rebase before merge) still run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    # A job that declares no timeout-minutes inherits GitHub's default ceiling of 6
    # hours, and while it burns those minutes it looks exactly like a slow run. This
    # job cannot legitimately be slow: `make test` is plain-shell suites over local
    # files, with the model stubbed via CLAUDE_BIN and no network call anywhere. So a
    # gates job still running past this cap is stuck, not slow, and the cap turns a
    # six-hour silent bill into a red tick that says so.
    #
    # The number is a measurement, not a guess, and it has moved. The ~40 s this comment
    # claimed until 2026-09-17 was stale by a factor of four (#273): the last six runs on
    # `main` took 160, 161, 162, 162, 168 and 175 s, because the suites spend most of
    # their time asleep — `supervise.sh` polls and measures heartbeats in whole seconds,
    # and `verify.test.sh` plus `supervise.test.sh` alone are ~87 s of the 155 s the 71
    # suites take (#282). At 3 minutes `main` had 5 s of headroom and two finished PRs
    # (#272, #286) were cancelled mid-run rather than failed.
    #
    # So this is **5 minutes, deliberately and temporarily**, to keep a green branch from
    # being cancelled while the suites are made fast. It costs nothing on a green run and
    # raises the ceiling on a STUCK job from 3 to 5 minutes — about 1.2 cents on
    # ubuntu-latest at $0.006/min. **Put it back to 3 once #282 (sub-second clock) and
    # #290 (the per-supervision python3 starts) have landed**, which should take the job
    # to well under 2 minutes.
    #
    # The number still assumes the docs gates stay out of CI (#90): while they ran here
    # the job took ~230 s, which even this budget would cut off. Putting them back means
    # raising this, deliberately, rather than discovering it as a failure.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Linux only. The scripts under skills/tdd/scripts/ promise to run on
      # both bash dialects — macOS ships bash 3.2 with BSD sed/grep/stat, Linux bash
      # 5.x with GNU coreutils — and this runner covers the Linux half. The macOS
      # half is covered by development happening on a Mac: every `make test` a leaf
      # runs before a commit runs under bash 3.2 there. A macos-latest runner used to
      # sit beside this one; it re-checked the environment the code was just tested
      # on, at ten times the per-minute price of Linux, and was ~94% of the billed
      # minutes on 2026-09-11. Nothing here needs installing: python3 and bash are
      # preinstalled, and nothing shells out to jq or gh — the scripts avoid jq (see
      # docs/wt/commentary.py) and the test suites stub the model via CLAUDE_BIN.
      - name: make test
        run: make test
