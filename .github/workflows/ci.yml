name: CI

# Every PR and every push to main runs the one gate veri asks of the repos it works
# on — `make test` — dogfooding: a red baseline here would be exactly what the
# conductor refuses to start against (see Makefile's `test` target comment).
#
# The docs gates (`make docs-check`, docs/tests/build-guards.test.sh) are deliberately
# NOT here. They were, from #34 until the day the walkthrough grew thirty sandboxed
# page builds: a job went from ~50 s to ~230 s on each runner, on every push of every
# PR, with macOS minutes billed at ten times Linux. Documentation drifting behind code
# must never block a TDD run (CLAUDE.md), so the docs gates are a local step of a docs
# PR — run `make docs-check` before merging one — not a tax on every commit.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linux only. The scripts under skills/solve-issue/scripts/ promise to run on
      # both bash dialects — macOS ships bash 3.2 with BSD sed/grep/stat, Linux bash
      # 5.x with GNU coreutils — and this runner covers the Linux half. The macOS
      # half is covered by development happening on a Mac: every `make test` a leaf
      # runs before a commit runs under bash 3.2 there. A macos-latest runner used to
      # sit beside this one; it re-checked the environment the code was just tested
      # on, at ten times the per-minute price of Linux, and was ~94% of the billed
      # minutes on 2026-09-11. Nothing here needs installing: python3 and bash are
      # preinstalled, and nothing shells out to jq or gh — the scripts avoid jq (see
      # docs/wt/commentary.py) and the test suites stub the model via CLAUDE_BIN.
      - name: make test
        run: make test
