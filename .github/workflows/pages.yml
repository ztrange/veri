name: Pages

# Publishes docs/walkthrough.html — the generated, annotated walkthrough — at
# https://ztrange.github.io/veri/ so it can be read without a clone. The page is
# self-contained (its only external references are Google Fonts), so the artifact
# is a single index.html; nothing is built here, because `make docs` already ran
# in the PR that changed the page. The repo is private; the Pages site is public by
# choice (the source it quotes is the point of the page), decided once, deliberately.
#
# MANUAL ONLY, and the trigger below is what makes it so. It used to deploy on every
# push to main that touched the page, which with a page that every docs PR regenerates
# meant a deploy per merge. A deploy is a publishing decision, not a side effect of
# landing a commit, so `on:` holds `workflow_dispatch:` and nothing else: no push,
# schedule or pull_request path exists by which a merge could deploy. Keep it that way.
# Run it by hand when a version is worth reading — `gh workflow run pages.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Same guardrail as ci.yml's gates job, different number on purpose. With no
    # timeout-minutes a job inherits GitHub's default ceiling of 6 hours and bills every
    # one of those minutes while looking exactly like a slow run; this job observably
    # takes 11-23 s. The budget is still deliberately larger than the gates job's 3
    # minutes, because the two fail differently: gates is local, deterministic work,
    # while most of this job is upload-pages-artifact and deploy-pages, which wait on
    # GitHub's Pages service and the github-pages environment — work this repo neither
    # controls nor can predict, and which can be slow on GitHub's side with nothing
    # wrong. A cap tight enough to catch a hang would also kill a deploy that was merely
    # waiting, and a failed publish is worse than a slow one: this workflow only ever
    # runs because a human triggered it and is watching. Ten minutes still turns a true
    # hang from six hours into ten.
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the page as index.html
        run: |
          mkdir -p _site
          cp docs/walkthrough.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
