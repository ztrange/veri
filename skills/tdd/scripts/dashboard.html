<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>veri dashboard</title>
</head>
<body>
<h1>veri dashboard</h1>
<h2>Runs</h2>
<pre id="runs"></pre>
<h2>Metrics</h2>
<pre id="metrics"></pre>
<h2>Events</h2>
<pre id="events"></pre>
<script>
// Each pane polls its own endpoint on its own two-second clock, so a slow answer from one
// never holds back the others. The Events pane shows the run named in the page's
// ?issue= query, the same number the Runs and Metrics endpoints key each run by.
var issue = new URLSearchParams(location.search).get("issue") || "";

function show(pane, answer) {
  answer
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById(pane).textContent = JSON.stringify(data, null, 2);
    })
    .catch(function () {});
}

function poll(refresh) {
  refresh();
  setInterval(refresh, 2000);
}

poll(function () { show("runs", fetch("/api/runs")); });
poll(function () { show("metrics", fetch("/api/metrics")); });
poll(function () {
  show("events", fetch("/api/events?issue=" + encodeURIComponent(issue)));
});
</script>
</body>
</html>
