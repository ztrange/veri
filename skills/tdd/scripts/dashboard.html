<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>veri dashboard</title>
</head>
<body>
<h1>veri dashboard</h1>
<h2>Runs</h2>
<pre id="runs"></pre>
<h2>Metrics</h2>
<pre id="metrics"></pre>
<h2>Events</h2>
<pre id="events"></pre>
<script>
// Each pane polls its own endpoint on its own schedule, so a slow answer from one never
// holds back the others. The Events pane shows the run named in the page's
// ?issue= query, the same number the Runs and Metrics endpoints key each run by.
var issue = new URLSearchParams(location.search).get("issue") || "";

function show(pane, answer) {
  return answer
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById(pane).textContent = JSON.stringify(data, null, 2);
    })
    .catch(function () {});
}

// A pane asks again two seconds after its previous request has settled — whether it answered
// or failed — never on a clock of its own. So a pane has at most one request in flight, and
// an endpoint slower than two seconds queues nothing up behind it.
function poll(pane, request) {
  show(pane, request()).finally(function () {
    setTimeout(function () { poll(pane, request); }, 2000);
  });
}

poll("runs", function () { return fetch("/api/runs"); });
poll("metrics", function () { return fetch("/api/metrics"); });
poll("events", function () {
  return fetch("/api/events?issue=" + encodeURIComponent(issue));
});
</script>
</body>
</html>
