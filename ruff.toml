# ruff, the static checker `make test` runs over every tracked Python file (PRD 039,
# tests/py/test_ruff_tree_audit_process.py): the pyflakes rules (unused imports, undefined and
# redefined names), the pycodestyle errors (E4, E7, E9) and warnings (W), the 120-column
# line-length cap (E501), import order, the complexity cap (C901) and the bugbear rules (likely bugs).
# `src` names the flat sibling
# directories, so their modules sort as first-party.
target-version = "py312"
line-length = 120
extend-exclude = [".tdd"]
src = ["skills/tdd/scripts/veri", "skills/tdd/scripts/tests/leg", "skills/tdd/scripts/tests/py"]

[lint]
select = ["F", "E4", "E7", "E9", "E501", "W", "I", "C901", "B"]
# E701: each veri module's bootstrap is the one line
# `if __name__ == "__main__": __import__("runpy").run_path(…"/pycache_prefix.py")`, pinned by
# tests/py/unit/test_shims.py and tests/py/test_stale_bytecode_process.py.
ignore = ["E701"]

[lint.mccabe]
max-complexity = 40

# Facade modules: other modules and tests reach names through them (`dispatch.subprocess`,
# `from wait_ci import trigger_lines`), so an import unused inside the file is still used.
# F401's "safe" fix deleted them and broke 570 cases of `make test`.
[lint.per-file-ignores]
"skills/tdd/scripts/veri/dispatch.py" = ["F401"]
"skills/tdd/scripts/veri/wait_ci.py" = ["F401"]
# E402: the imports left below code must follow a setting.
# The leg's veri imports follow sys.path[0] = VERI and pycache_prefix.py, which sets sys.pycache_prefix.
"skills/tdd/scripts/tests/leg/pytest_leg.py" = ["E402"]
# `from veri import entry` follows the sys.path inserts and the sys.meta_path finder for `veri.<name>`.
"skills/tdd/scripts/tests/py/conftest.py" = ["E402"]
# Its later imports follow sys.dont_write_bytecode: the entry-point run writes no bytecode for them.
"skills/tdd/scripts/veri/run_conductor.py" = ["E402"]
# E501: the test tree is not wrapped yet. The follow-up sweeps that remove this line wrap tests/py/ outside unit/,
# then tests/py/unit/.
"skills/tdd/scripts/tests/py/**" = ["E501"]
